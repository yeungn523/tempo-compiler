# Drives the build and test pipeline. Running bare 'tox' builds mlir/, runs every test suite against that build, and
# repeats the lit suite against a separate AddressSanitizer build. 'tox -e clean,build' rebuilds from scratch.
[tox]
requires =
    tox>=4,<5
    tox-uv>=1,<2
envlist =
    build
    test
    memcheck

# The repository runs from a checkout rather than as an installed distribution, so no environment installs it.
[testenv]
basepython = py311
skip_install = true

[testenv:build]
description =
    Fetches and verifies the pinned toolchain, then configures and builds mlir/ into mlir/build. Reads the pins from
    the pyproject.toml file.
dependency_groups = mlir
allowlist_externals = ninja
commands =
    python tools/toolchain/setup_toolchain.py --configure
    ninja -C mlir/build

[testenv:test]
description = Runs the lit suite against mlir/build, then the compiler's and the board package's Python suites.
depends = build
dependency_groups =
    compiler
    mlir
    test
commands =
    lit -sv mlir/build/test
    pytest -q tests board_package/tests {posargs}

# Leaks are reported for every allocation, but memory errors are caught only in mlir/'s own code, since the prebuilt LLVM
# and MLIR libraries are uninstrumented. Those libraries also never unpoison the memory the instrumented LLVM headers
# poison, so allow_user_poisoning=0 turns that manual poisoning off rather than report it as use-after-poison.
[testenv:memcheck]
description =
    Builds mlir/ into mlir/build-asan with AddressSanitizer and runs the lit suite against it, failing on any memory
    error or leak.
dependency_groups = mlir
setenv =
    ASAN_OPTIONS = detect_leaks=1:allow_user_poisoning=0:halt_on_error=1
allowlist_externals = ninja
commands =
    python tools/toolchain/setup_toolchain.py --configure --sanitize --build-dir mlir/build-asan
    ninja -C mlir/build-asan
    lit -sv mlir/build-asan/test

[testenv:clean]
description = Removes the mlir/build and mlir/build-asan build directories.
allowlist_externals = rm
commands =
    rm -rf mlir/build mlir/build-asan
